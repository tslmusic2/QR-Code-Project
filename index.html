<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
    <link href="style.css" rel="stylesheet"/>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution { font-size: 0.6875rem; text-align: center; }
      .attribution a { color: hsl(228, 45%, 44%); }
    </style>
  </head>

    <div class="body">
      <body>
        <div class="qr-image">
          <img src="images/image-qr-code.png" alt="qr code">
        </div>
        <div class="h2">
          <h2>Improve your front-end</h2> 
          <h2>skills by building projects</h2>
        </div>
        <div class="paragraph">
          <p>Scan the QR code to visit Frontend</p> 
          <p>Mentor and take your coding skills to</p>
          <p>the next level</p>
        </div>
      </body>
    </div>


    
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Paul Papantonio</a>.
    </footer>
  </html>
